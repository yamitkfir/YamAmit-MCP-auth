[project]
name = "mcpauth"
version = "0.1.0"
description = "MCP server authentication-gap mapper"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "mcp>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
mcpauth = "mcpauth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpauth"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
